name: formd
on:
  workflow_dispatch:
    inputs:
      user_agent:
        description: "SEC contact for the User-Agent header: name and email (SEC fair-access rules)"
        required: true
permissions:
  contents: write
jobs:
  formd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install pandas requests
      - name: Connectivity probe
        env:
          SEC_USER_AGENT: ${{ inputs.user_agent }}
        run: |
          mkdir -p formd_out
          {
            echo "listing: $(curl -sS -m 30 -o /dev/null -w '%{http_code} %{size_download}' -A "$SEC_USER_AGENT" https://www.sec.gov/data-research/sec-markets-data/form-d-data-sets)"
            echo "2024q1: $(curl -sS -m 60 -o /dev/null -w '%{http_code} %{size_download}' -A "$SEC_USER_AGENT" https://www.sec.gov/files/structureddata/data/form-d-data-sets/2024q1_d.zip)"
          } > formd_out/probe.txt 2>&1 || true
          cat formd_out/probe.txt
      - name: SEC Form D data sets, biotech / pharma / other health care offerings
        timeout-minutes: 75
        env:
          SEC_USER_AGENT: ${{ inputs.user_agent }}
        run: python pilot/fetch_formd.py formd_out 2009
      - name: Publish the extract on the formd-data branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan formd-data
          git rm -rq --cached .
          mkdir -p data_formd && mv formd_out/* data_formd/
          git add -f data_formd
          git commit -qm "Form D extract $(date -u +%F) from ${GITHUB_SHA::7}"
          git push -f origin formd-data
